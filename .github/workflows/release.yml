name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # scoped to creating the release only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install -e '.[dev]' build
      - name: Gate release on tests and static lint
        run: |
          ruff check src tests
          pytest -q --cov=attestforge --cov-branch --cov-report=term-missing
          bash scripts/smoke.sh
      - name: Build source and wheel distributions
        run: python -m build
      - name: Publish GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
