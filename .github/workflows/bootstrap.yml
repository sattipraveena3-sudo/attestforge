name: Bootstrap AttestForge
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Reconstruct validated project package
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/part00
          mkdir -p /tmp/attestforge
          cat .bootstrap/part* | tr -d '\n\r' > /tmp/attestforge.b64
          base64 --decode /tmp/attestforge.b64 > /tmp/attestforge.tar.gz
          tar -xzf /tmp/attestforge.tar.gz -C /tmp/attestforge
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/attestforge/. .
      - name: Publish complete project tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete AttestForge v0.1.0 implementation"
          git push origin HEAD:main
