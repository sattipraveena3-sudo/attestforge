[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attestforge"
version = "0.1.0"
description = "Offline-first software supply-chain release attestations, SBOM binding, and policy verification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Praveena Satti"}]
keywords = ["software-supply-chain", "attestation", "DSSE", "in-toto", "SBOM", "Ed25519"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11"]
dependencies = ["cryptography>=44,<49"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.27,<1", "ruff>=0.12,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
attestforge = "attestforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["attestforge"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
